<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autodesk Browser Tree</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f9;
        }

        .box {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        ul {
            list-style: none;
            padding-left: 22px;
        }

        .folder {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
        }
        
        .folder:hover {
            background: #eef;
        }
        
        .folder-checkbox {
            margin: 0;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .children {
            display: none;
        }

        .open>.children {
            display: block;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Autodesk Browser</h2>

        <select id="region">
            <option value="">Select Region</option>
        </select>

        <select id="hub" disabled>
            <option value="">Select Hub</option>
        </select>

        <select id="project" disabled>
            <option value="">Select Project</option>
        </select>

        <h3>Folders</h3>

        <div id="tree"></div>

        <button id="saveBtn">Save Selected Folders</button>
    </div>

    <script>

        const BASE = "http://127.0.0.1:8000/api/aps";

        const region = document.getElementById("region");
        const hub = document.getElementById("hub");
        const project = document.getElementById("project");
        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzg0NzEyOTUxLCJpYXQiOjE3ODQ3MDkzNTEsImp0aSI6IjBmYWJjMTkwMmE0YzQxMzM4OWYyOGZjOGMyMTFhYWJlIiwidXNlcl9pZCI6IjMifQ.s5CO62PGv-ZcHKKMrTO9mqgk7d7pz9mVKoUFNEROxRs";

        async function api(url) {

            const response = await fetch(url, {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });

            return await response.json();
        }

        loadRegions();

        async function loadRegions() {

            const data = await api(`${BASE}/fetch_regions/`);

            region.innerHTML = '<option value="">Select Region</option>';

            (data.results || []).forEach(item => {

                region.innerHTML += `
                    <option value="${item}">
                        ${item}
                    </option>
                `;

            });
        }

        region.onchange = async () => {

            hub.disabled = false;
            project.disabled = true;

            hub.innerHTML = '<option value="">Select Hub</option>';
            project.innerHTML = '<option value="">Select Project</option>';

            document.getElementById("tree").innerHTML = "";

            const data = await api(
                `${BASE}/fetch_hubs/${region.value}/`
            );

            (data.results || []).forEach(item => {

                hub.innerHTML += `
                    <option value="${item.id}">
                        ${item.attributes.name}
                    </option>
                `;

            });

        };

        hub.onchange = async () => {

            project.disabled = false;

            project.innerHTML = '<option value="">Select Project</option>';

            document.getElementById("tree").innerHTML = "";

            const data = await api(
                `${BASE}/fetch_projects/${hub.value}/`
            );

            (data.results || []).forEach(item => {

                project.innerHTML += `
                    <option value="${item.id}">
                        ${item.attributes.name}
                    </option>
                `;

            });

        };

        project.onchange = async () => {

            const tree = document.getElementById("tree");

            tree.innerHTML = "";

            const data = await api(
                `${BASE}/hub/${hub.value}/fetch_top_folders/${project.value}/`
            );

            const ul = document.createElement("ul");

            tree.appendChild(ul);

            (data.results || []).forEach(folder => {
                ul.appendChild(makeNode(folder, ""));
            });

        };

        function makeNode(item, parentPath) {
            const folderName = item.attributes.displayName || item.attributes.name;
            const currentPath = parentPath
                ? `${parentPath}/${folderName}`
                : folderName;

            const li = document.createElement("li");

            const div = document.createElement("div");
            div.className = "folder";

            if (item.type === "folders") {

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "folder-checkbox";
            
                checkbox.dataset.folderId = item.id;
                checkbox.dataset.folderName = folderName;
                checkbox.dataset.path = currentPath;
            
                div.appendChild(checkbox);
            }

            const icon = document.createElement("span");
            if (item.type === "folders") {
                icon.textContent = "📁";
            } else {
                icon.textContent = "📄";
            }

            const text = document.createElement("span");
            const name = item.attributes.displayName || item.attributes.name;

            text.textContent = name;

            if (item.type === "items") {
                text.style.color = "#444";
            }

            div.appendChild(icon);
            div.appendChild(text);

            if (item.type === "folders") {

                div.onclick = async () => {

                    if (li.dataset.loaded) {
                        li.classList.toggle("open");
                        return;
                    }

                    const data = await api(
                        `${BASE}/project/${project.value}/folder/${encodeURIComponent(item.id)}`
                    );

                    const children = document.createElement("ul");
                    children.className = "children";

                    (data.results || []).forEach(child => {
                        children.appendChild(makeNode(child, currentPath));
                    });

                    li.appendChild(children);

                    li.dataset.loaded = "1";
                    li.classList.add("open");
                };

            }
            li.appendChild(div);

            return li;
        }

        document.getElementById("saveBtn").onclick = async () => {

            const folders = [];
        
            document.querySelectorAll(".folder-checkbox:checked").forEach(cb => {
        
                folders.push({
                    folder_id: cb.dataset.folderId,
                    name: cb.dataset.folderName,
                    path: cb.dataset.path
                });
        
            });
        
            if (folders.length === 0) {
                alert("Please select at least one folder.");
                return;
            }
        
            const response = await fetch(
                `${BASE}/save_data/project/${project.value}/`,
                {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        folders: folders
                    })
                }
            );
        
            const data = await response.json();
        
            console.log(data);
        
            alert(data.message);
        
        };
    </script>

</body>

</html>
